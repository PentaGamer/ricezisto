# ==============================================================================
# Ricezisto - Vicinae Catppuccin Mocha Mauve Theme
# ==============================================================================

[meta]
name = "catppuccin-mocha-mauve"
description = "Ricezisto Catppuccin Mocha theme with Mauve accent"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "#cba6f7"
accent_foreground = "#11111b"
background = "#1e1e2e"
foreground = "#cdd6f4"
secondary_background = "#181825"
border = "#313244"

[colors.main_window]
border = "#313244"
footer = { background = "#181825" }

[colors.settings_window]
border = "#313244"

[colors.accents]
blue = "#89b4fa"
green = "#a6e3a1"
magenta = "#cba6f7"
orange = "#fab387"
red = "#f38ba8"
yellow = "#f9e2af"
cyan = "#94e2d5"
purple = "#cba6f7"

[colors.shortcut]
border = "#45475a"

[colors.text]
default = "#cdd6f4"
muted = "#a6adc8"
danger = "#f38ba8"
success = "#a6e3a1"
placeholder = "#6c7086"
selection = { background = "#cba6f7", foreground = "#11111b" }

[colors.text.links]
default = "#89b4fa"
visited = "#cba6f7"

[colors.input]
border = "#313244"
border_focus = "#cba6f7"
border_error = "#f38ba8"

[colors.button.primary]
background = "#313244"
foreground = "#cdd6f4"
hover = { background = "#45475a" }
focus = { outline = "#cba6f7" }

[colors.list.item.hover]
foreground = "#cdd6f4"
secondary_foreground = "#a6adc8"

[colors.list.item.selection]
background = "#313244"
foreground = "#cba6f7"
secondary_background = "#313244"
secondary_foreground = "#cba6f7"

[colors.grid.item]
background = "#181825"
hover = { outline = "#cba6f7" }
selection = { outline = "#cba6f7" }

[colors.scrollbars]
background = "#313244"

[colors.loading]
bar = "#cba6f7"
spinner = "#cba6f7"
