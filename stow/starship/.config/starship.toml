# ==============================================================================
# Ricezisto - Starship Prompt Configuration (Catppuccin Mocha Mauve)
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$rust\
$golang\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[os]
disabled = false
style = "bold mauve"

[os.symbols]
Ubuntu = " "
Debian = " "
Linux = "󰌽 "

[directory]
style = "bold lavender"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[fill]
symbol = " "

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold peach"
format = "[$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold sapphire"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold yellow"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold blue"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
